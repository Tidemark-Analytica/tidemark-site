<style>
  /* ---- Type scale -------------------------------------------------------
     One fluid ramp drives every size, so the hierarchy holds identically at
     every width. Each step is linear between a 320px and a 1440px viewport;
     because the steps share a slope family, their RATIOS stay stable instead
     of crossing over (the old CSS mixed 5vw / 4.1vw / 3.2vw / fixed, which
     inverted the hierarchy below ~508px).
       tagline  24 -> 40px   largest
       wordmark 21 -> 34px
       body     17 -> 25px
       small    14 -> 17px   contact + footer, the smallest step
     ------------------------------------------------------------------- */
  :root {
    --fs-tagline:  clamp(1.500rem, 1.214rem + 1.43vw, 2.500rem);
    --fs-wordmark: clamp(1.300rem, 1.080rem + 1.16vw, 2.125rem);
    --fs-body:     clamp(1.063rem, 0.920rem + 0.71vw, 1.563rem);
    --fs-small:    clamp(0.875rem, 0.821rem + 0.27vw, 1.063rem);
  }

  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
    font-family: "Cascadia Code", "Cascadia Mono", Consolas, monospace;
    background: #16367C;
  }

  .top {
    background: #FFFFFF;
    border-bottom: 1px solid #D8D8D8;
    padding: 1.6rem 1rem;
    text-align: center;
  }
  .top .name {
    margin: 0;
    color: #26317E;
    font-size: var(--fs-wordmark);
    letter-spacing: 0.08em;
    font-variant: small-caps;
  }

  .sea {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: #16367C;
    color: #FFFFFF;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 3rem 1.5rem clamp(3rem, 9vh, 5.5rem);
  }
  .sea img.bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 22%;
    filter: grayscale(1) sepia(1) hue-rotate(185deg) saturate(2.4) brightness(0.72) contrast(1.06);
    pointer-events: none;
  }
  .sea .shade {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top,
      rgba(9, 22, 60, 0.62) 0%,
      rgba(9, 22, 60, 0.25) 45%,
      rgba(9, 22, 60, 0.3) 100%);
    pointer-events: none;
  }
  .sea .lede {
    position: relative;
    top: clamp(0.5rem, 5vh, 3.5rem);
    font-size: var(--fs-tagline);
    /* needed now that the line can wrap: .lede sits outside .inner, so it
       never inherited a text-align and its wrapped lines fell back to left */
    text-align: center;
    /* was `white-space: nowrap`, which clipped this line at 320px (287px of
       text in a 272px box, silently cut by the parent's overflow:hidden).
       Wrapping is the safe behaviour; `balance` keeps the two lines even. */
    text-wrap: balance;
    margin: 0;
    text-shadow: 0 1px 14px rgba(4, 12, 40, 0.7);
  }
  .sea .inner {
    position: relative;
    text-align: center;
    line-height: 1.55;
    text-shadow: 0 1px 14px rgba(4, 12, 40, 0.7);
  }
  .sea .inner p {
    font-size: var(--fs-body);
    margin: 0 0 2rem;
  }
  /* contact drops to the smallest step, matching the footer */
  .sea .inner p.contact {
    font-size: var(--fs-small);
  }
  .sea .inner p:last-child { margin-bottom: 0; }
  .sea a {
    color: #FFFFFF;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .sea a:hover { color: #C9DCF5; }

  .bottom {
    background: #0B1B45;
    color: #C7D3EC;
    text-align: center;
    font-size: var(--fs-small);
    line-height: 1.5;
    padding: 1rem;
  }
</style>
